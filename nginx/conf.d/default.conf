server {
    listen 80;
    server_name shelfa.co.kr www.shelfa.co.kr;
    server_tokens off;

    # Let's Encrypt 인증서 발급을 위한 챌린지 경로 열어두기
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 80포트 접속(HTTP)은 무조건 HTTPS(443포트)로 강제 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name shelfa.co.kr www.shelfa.co.kr;
    server_tokens off;

    # SSL 인증서 경로 (certbot이 발급 후 저장할 경로)
    ssl_certificate /etc/letsencrypt/live/shelfa.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shelfa.co.kr/privkey.pem;
    
    # 강력한 최신 보안 설정 적용 (TLSv1.2, TLSv1.3 강제)
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # [보안] HSTS(HTTP Strict Transport Security) 강제 적용 및 브라우저 보호 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # [보안] 1초에 10번 초과 시 차단 (DDoS 완화)
    limit_req zone=mylimit burst=20 nodelay;

    # 클라이언트 실제 IP 및 HTTPS 통신 여부 전달
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1. API 문서 접근 제어 (비밀번호 설정)
    location ~ ^/(docs|redoc|openapi.json) {
        auth_basic "Restricted API Documentation";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8000;
    }

    # 2. 파이썬 백엔드 API
    location ~ ^/(auth|users|books|loans|reservations|favorites|health|chat) {
        proxy_pass http://127.0.0.1:8000;
    }

    # 3. 그 외 접속은 프론트엔드 서버로 트래픽 전달
    location / {
        proxy_pass http://127.0.0.1:8081;
    }
}