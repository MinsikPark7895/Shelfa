# ============================================================
# [운영 모드] 보안 모드 활성화 (클라우드 배포용)
# 환경 변수 SHELFA_ENV=prod 일 때 자동으로 사용됩니다.
# ============================================================
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
