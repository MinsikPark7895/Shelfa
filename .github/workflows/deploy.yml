name: CI/CD to GCP

on:
  push:
    branches:
      - main
      - dev-Backend
      - dev-Frontend
      - dev-Robot

jobs:
  test:
    name: Fast CI (Syntax Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          
      - name: Lint with flake8
        run: |
          # 파이썬 문법 에러 및 정의되지 않은 변수 등의 치명적인 에러만 빠르게 잡아냅니다 (약 10초 소요)
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics

  deploy:
    name: CD to GCP
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          command_timeout: 120m
          script: |
            # 서버 내부 작업
            cd ~/Shelfa
            # 저장소 최신화
            git fetch --all
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            
            # 도커 빌드킷(Buildx) 플러그인 수동 설치 (GCP 서버에 없을 경우 대비)
            mkdir -p ~/.docker/cli-plugins
            curl -sSL https://github.com/docker/buildx/releases/download/v0.17.1/buildx-v0.17.1.linux-amd64 -o ~/.docker/cli-plugins/docker-buildx
            chmod +x ~/.docker/cli-plugins/docker-buildx
            
            # 도커 빌드킷(BuildKit)을 명시적으로 활성화하여 캐시 마운트 기능 켜기
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            
            # 기존 컨테이너 및 찌꺼기를 깔끔하게 내리기 (y/N 프롬프트 에러 방지)
            docker-compose down
            
            # 도커 백그라운드 재시작 (변경된 이미지만 다시 빌드)
            docker-compose up -d --build
